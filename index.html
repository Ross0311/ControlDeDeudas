<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de Deudas</title>
  <meta name="theme-color" content="#0f3d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control de Deudas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema (claro / oscuro / automático) antes de dibujar la app
    (function () {
      var t = 'auto'; try { t = localStorage.getItem('md-tema') || 'auto'; } catch (e) {}
      if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="splash"><div class="logo-mark">S/</div><p>Cargando…</p></div>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
